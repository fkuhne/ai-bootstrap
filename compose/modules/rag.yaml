# The RAG module's services: Qdrant, which stores the chunks and computes their BM25 weights,
# and llama.cpp's server with an embedding model, at /v1/embeddings; and its demo
# (docs/foundations.md#rag).
# compose.yaml pulls this file in; delete both, and the module's settings, to remove it.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    # 0 leaves it out, when Qdrant runs elsewhere; it follows RAG_ENABLED unless set.
    scale: ${RAG_LOCAL_QDRANT:-${RAG_ENABLED:-1}}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      # Its API, and its dashboard at /dashboard, on this machine only.
      - 127.0.0.1:${RAG_QDRANT_PORT:-6333}:6333
    healthcheck:
      # The image has neither curl nor wget, so bash asks /readyz itself.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  embedding:
    # The LLM's variant files: the same pinned image, and the GPU access. It follows LLM_GPU
    # unless RAG_GPU says otherwise.
    extends:
      file: ../llm-${RAG_GPU:-${LLM_GPU:-cpu}}.yaml
      service: llm
    # 0 leaves the local server out, when the embeddings come from elsewhere; it follows
    # RAG_ENABLED unless set.
    scale: ${RAG_LOCAL_EMBEDDING:-${RAG_ENABLED:-1}}
    environment:
      LLAMA_ARG_PORT: 8080
      LLAMA_CACHE: /models
      LLAMA_ARG_HF_REPO: ${RAG_HF_MODEL:-ggml-org/embeddinggemma-2-GGUF:Q8_0}
      LLAMA_ARG_EMBEDDINGS: 1
      # Text only: a model that also embeds images and audio keeps that part in a file of its
      # own, which isn't downloaded.
      LLAMA_ARG_MMPROJ_AUTO: 0
      # An embedding model reads each text in one batch, so the batch is the longest text it
      # takes. It also bounds the memory, which grows by about 1 MB per token in the batch on
      # CPU, however many texts a request carries.
      LLAMA_ARG_CTX_SIZE: ${RAG_CONTEXT_SIZE:-1024}
      LLAMA_ARG_BATCH: ${RAG_CONTEXT_SIZE:-1024}
      LLAMA_ARG_UBATCH: ${RAG_CONTEXT_SIZE:-1024}
      # Only pages served from this machine may call it from a browser. llama.cpp lets every
      # origin by default, so any website open in the browser could use the model. The backend
      # calls it from inside Docker, where CORS doesn't apply.
      LLAMA_ARG_CORS_ORIGINS: localhost
    volumes:
      - embedding-models:/models
    ports:
      - 127.0.0.1:${RAG_EMBEDDING_PORT:-8082}:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      # The first start downloads the model, so failures count only after 15 minutes.
      start_period: 15m
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3

  # Stores chunks as an app would, lists, replaces and deletes them:
  # docker compose run --rm rag-demo
  rag-demo:
    image: python:3.14.8-slim-trixie
    profiles: [tools]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # The demo imports the core's helpers, demo.py, from the scripts' folder.
      PYTHONPATH: /scripts
    volumes:
      - ../../scripts:/scripts:ro
    entrypoint: ["python", "/scripts/modules/rag/demo_rag.py"]

  # Stores the sample chunks, keeps them for the Documents page, and checks that each sample
  # question finds its chunk: docker compose run --rm rag-samples [--delete]
  rag-samples:
    image: python:3.14.8-slim-trixie
    profiles: [tools]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PYTHONPATH: /scripts
    volumes:
      - ../../scripts:/scripts:ro
    entrypoint: ["python", "/scripts/modules/rag/samples.py"]

volumes:
  qdrant-data:
  embedding-models:
