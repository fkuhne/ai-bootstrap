# The web UI's server (docs/foundations.md#the-web-ui): the React app's build, and /api forwarded to
# the backend, all from one origin, so the browser needs no CORS.

# Docker's DNS server. With the backend's name in a variable, nginx looks its address up when a
# request needs it, again every 10 s, instead of once at start: it starts before the backend
# exists, and a recreated backend container gets a new address.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Text compressed on the way out.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The container's health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, forwarded to FastAPI with its path unchanged.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed answers pass through as they're written, not once they're complete.
        proxy_buffering off;
        # How long the backend may stay silent. A JSON answer on a slow CPU sends nothing until
        # it's complete, which can take minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        # A question can carry images, audio or video, as base64; nginx's default allows 1 MB.
        client_max_body_size 64m;
    }

    # The build's bundles: their names change with their content, so they're cached for a year.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else is the app. A path with no file, such as a module's page, gets index.html,
    # and the app's router shows the page. index.html is never cached, so a rebuild shows at once.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
