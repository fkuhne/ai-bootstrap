# Security headers for the app's own pages and files, included by each location that serves
# them. nginx drops the server's add_header lines in a location that adds its own, so they're
# included where needed instead of set once.

# Only our own scripts, styles and API: no inline script, nothing from another site. Images,
# audio and video may also be data: URIs, as attachments are.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# The browser uses the type the server declares, never one it guesses from the content.
add_header X-Content-Type-Options "nosniff" always;
# Another site sees only our origin in Referer, never a conversation's URL.
add_header Referrer-Policy "same-origin" always;
